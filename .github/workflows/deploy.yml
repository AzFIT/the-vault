name: Build site to docs/

# Pages is configured to deploy from the /docs folder on main.
# This workflow rebuilds the production bundle on every push to main
# and commits it to docs/, so the live site always tracks the code.
# It pushes with [skip ci] and ignores docs/** pushes to avoid loops.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  # Manual retry entry point — see "Run workflow" on the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /the-vault/

      - name: Stage build into docs/
        run: |
          cp dist/index.html dist/404.html   # SPA fallback for deep links
          rm -rf docs
          mkdir docs
          cp -r dist/. docs/
          touch docs/.nojekyll               # serve files as-is, no Jekyll

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "docs/ unchanged"
          else
            git commit -m "Build site to docs/ [skip ci]"
            git push
          fi
